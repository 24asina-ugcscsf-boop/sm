<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFRC Sivakasi - Campus Navigation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
    --ink-900: #0E0C22;
    --ink-800: #1D1A3D;
    --ink-700: #262151;
    --violet: #6C5CE7;
    --violet-soft: #8B7FE8;
    --violet-bright: #A599FF;
    --amber: #F5A623;
    --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Poppins", sans-serif;
    height: 100vh;
    background: radial-gradient(circle at 30% 20%, var(--ink-700), var(--ink-900) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

/* faint blueprint grid backdrop */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(108, 92, 231, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 92, 231, 0.08) 1px, transparent 1px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 75%);
            mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 75%);
    pointer-events: none;
}

/* glow blobs */
.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(30px);
    pointer-events: none;
}
.glow-violet {
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(108,92,231,0.4), transparent 70%);
    top: -160px; right: -140px;
    animation: drift 12s ease-in-out infinite;
}
.glow-amber {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(245,166,35,0.22), transparent 70%);
    bottom: -180px; left: -120px;
    animation: drift 14s ease-in-out infinite reverse;
}

@keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(20px, -25px) scale(1.08); }
}

/* floating dots */
.spark {
    position: absolute;
    border-radius: 50%;
    background: var(--violet-bright);
    opacity: 0.55;
    animation: floatUp 7s ease-in-out infinite;
    pointer-events: none;
}
@keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.15; }
    50%  { opacity: 0.7; }
    100% { transform: translateY(-90px) scale(0.6); opacity: 0; }
}

.start-card {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--white);
    padding: 40px;
    max-width: 480px;
}

/* logo with orbiting ring */
.logo-wrap {
    position: relative;
    width: 108px;
    height: 108px;
    margin: 0 auto 28px;
}
.logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 28px;
    border: 1.5px solid rgba(139, 127, 232, 0.35);
    animation: spin 10s linear infinite;
}
.logo-ring::before, .logo-ring::after {
    content: "";
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px 2px rgba(245,166,35,0.7);
}
.logo-ring::before { top: -3.5px; left: 50%; margin-left: -3.5px; }
.logo-ring::after { bottom: -3.5px; left: 50%; margin-left: -3.5px; }

@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* logo-icon now hosts the real college crest image instead of a generic icon.
   Background switched to white so the gold/cream crest reads clearly. */
.logo-icon {
    position: absolute;
    inset: 10px;
    border-radius: 22px;
    background: linear-gradient(135deg, #FFFFFF, #F3F1FF);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-shadow: 0 18px 44px rgba(108, 92, 231, 0.5), inset 0 1px 0 rgba(255,255,255,0.6);
    animation: float 4s ease-in-out infinite;
}

.logo-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
}

.college-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.35;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #FFFFFF, var(--violet-bright) 60%, var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.college-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.1em;
    margin-bottom: 34px;
    text-transform: uppercase;
}

.tagline {
    font-family: "Inter", sans-serif;
    font-size: 13.5px;
    color: rgba(255,255,255,0.68);
    margin-bottom: 34px;
    line-height: 1.65;
}

.dot-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(245,166,35,0.6);
    animation: pulse 1.8s infinite;
    vertical-align: middle;
}

@keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(245,166,35,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(245,166,35,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,166,35,0); }
}

/* feature chips */
.feature-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 34px;
    flex-wrap: wrap;
}
.feature-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
}
.feature-chip i { color: var(--violet-bright); font-size: 11px; }

.get-started-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--violet), #7C6FF0);
    color: var(--white);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 16px 38px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 14px 34px rgba(108, 92, 231, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
}

.get-started-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shine 3s ease-in-out infinite;
}

@keyframes shine {
    0%   { left: -60%; }
    50%  { left: 130%; }
    100% { left: 130%; }
}

.get-started-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 40px rgba(108, 92, 231, 0.6);
}

.footer-tag {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.1em;
    z-index: 2;
}
</style>
</head>

<body>

<div class="glow glow-violet"></div>
<div class="glow glow-amber"></div>

<!-- floating sparks -->
<div class="spark" style="width:5px;height:5px; left:18%; top:70%; animation-delay:0s;"></div>
<div class="spark" style="width:3px;height:3px; left:75%; top:65%; animation-delay:1.5s;"></div>
<div class="spark" style="width:4px;height:4px; left:60%; top:80%; animation-delay:3s;"></div>
<div class="spark" style="width:3px;height:3px; left:30%; top:75%; animation-delay:4.5s;"></div>
<div class="spark" style="width:5px;height:5px; left:85%; top:30%; animation-delay:2s;"></div>

<div class="start-card">
    <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo-icon">
            <img src="images/logo.png" alt="SFRC College Crest">
        </div>
    </div>

    <div class="college-name">
        THE STANDARD FIREWORKS<br>RAJARATNAM COLLEGE FOR WOMEN
    </div>
    <div class="college-sub">Sivakasi &nbsp;&bull;&nbsp; Estd. 1968</div>

    <p class="tagline">
        <span class="dot-pulse"></span>&nbsp;
        Find your way around campus with live navigation, building info, and a built-in assistant.
    </p>

    <div class="feature-row">
        <div class="feature-chip"><i class="fa-solid fa-map-location-dot"></i> Live Map</div>
        <div class="feature-chip"><i class="fa-solid fa-comments"></i> Assistant</div>
        <div class="feature-chip"><i class="fa-solid fa-building"></i> Directory</div>
    </div>

    <button class="get-started-btn" onclick="window.location.href='dashboard.html'">
        Get Started
        <i class="fa-solid fa-arrow-right"></i>
    </button>
</div>

<div class="footer-tag">SMART 3D CAMPUS NAVIGATION</div>

</body>
</html>
